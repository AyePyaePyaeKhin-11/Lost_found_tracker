# docker-compose.prod.yaml - run the Lost & Found Tracker on the server.
#
#   docker compose -f docker-compose.prod.yaml up -d --build
#
# Differences from docker-compose.yaml (which is for local development):
#   - Next.js runs the production build (npm run start), not `npm run dev`
#   - no source-code volumes and no --reload: the code is built into the images
#   - passwords and the JWT secret come from the .env file (never committed)
#   - PostgreSQL is NOT published on port 5432, only the app containers reach it
#   - every container restarts by itself after a crash or a server reboot

services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ./backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"          # FastAPI docs at http://<server>:8000/docs
    env_file:
      - .env                 # JWT_SECRET, REQUIRE_EMAIL_VERIFICATION, FRONTEND_URL, SMTP_*
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-kmitl.ac.th}
      UPLOAD_DIR: /src/uploads
    volumes:
      - uploads_data:/src/uploads   # report photos, kept across redeploys
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

  nextjs:
    build:
      context: ./nextjs        # the Dockerfile runs `npm run build`, then `npm run start`
    restart: unless-stopped
    ports:
      - "3000:3000"          # the website: http://<server>:3000
    depends_on:
      - backend-api

volumes:
  postgres_data:
  uploads_data:
